<main data-placeholder="Pin a reference…"><div class="sheet">
  <header class="mast"><p class="kicker">Studio pinboard</p><h1>{{name}}</h1></header>
  <div class="board-bar">
    <div class="filters" role="group" aria-label="Filter materials">
      <button type="button" data-filter="all" aria-pressed="true">All materials</button>
      <button type="button" data-filter="image" aria-pressed="false">Images</button>
      <button type="button" data-filter="type" aria-pressed="false">Type</button>
      <button type="button" data-filter="colour" aria-pressed="false">Colour</button>
      <button type="button" data-filter="note" aria-pressed="false">Notes</button>
      <button type="button" data-filter="link" aria-pressed="false">Links</button>
    </div>
    <button type="button" class="action primary pin" data-draft="Pin to my board: ">+ Pin something</button>
  </div>
  <section class="board" aria-label="Starter collection">
    <figure class="print" data-material="image">
      <div class="still" role="img" aria-label="A cut blood orange on torn cobalt paper in afternoon sunlight"></div>
      <figcaption><b>Citrus in cobalt</b><small>Still life · starter print</small></figcaption>
    </figure>
    <div class="pile">
      <article class="type" data-material="type"><h2 class="kicker">Type specimen</h2><strong aria-hidden="true">Aa</strong><p>Old-style serif / Italic</p></article>
      <article class="palette" data-material="colour"><h2 class="kicker">From the print</h2>
        <div class="swatches" aria-hidden="true"><i style="--sample:#ef7845"></i><i style="--sample:#2246a4"></i><i style="--sample:#eba89c"></i><i style="--sample:#e8c795"></i></div>
        <p class="swatch-names">Citrus · Cobalt · Blush · Kraft</p></article>
    </div>
    <div class="pile">
      <article class="slip" data-material="note"><h2 class="kicker">Studio note</h2><p>Try the rough edge against something precise.</p></article>
      <article class="reference" data-material="link"><h2 class="kicker">Reference shelf</h2><a href="https://letterformarchive.org/">Letterform Archive ↗</a></article>
    </div>
  </section>
</div></main>
<script>
const filters = document.querySelectorAll('[data-filter]');
for (const filter of filters) {
  filter.addEventListener('click', () => {
    for (const button of filters) button.setAttribute('aria-pressed', String(button === filter));
    for (const item of document.querySelectorAll('[data-material]')) {
      item.hidden = filter.dataset.filter !== 'all' && item.dataset.material !== filter.dataset.filter;
    }
    for (const pile of document.querySelectorAll('.pile')) pile.hidden = !pile.querySelector('[data-material]:not([hidden])');
  });
}
</script>
