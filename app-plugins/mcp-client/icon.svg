<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="190"/></clipPath>
    <clipPath id="body"><path d="M300 372a32 32 0 0 1 32-32h360a32 32 0 0 1 32 32v168c0 128-92 230-212 230S300 668 300 540Z"/></clipPath>

    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c3d33"/>
      <stop offset=".55" stop-color="#041f1a"/>
      <stop offset="1" stop-color="#010a08"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx=".56" cy=".4" r=".62">
      <stop offset="0" stop-color="#2ff0c0" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#14b891" stop-opacity=".1"/>
      <stop offset="1" stop-color="#14b891" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fff1" stop-opacity=".6"/>
      <stop offset=".3" stop-color="#7fe9c6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6b70"/>
      <stop offset=".2" stop-color="#e9f3f2"/>
      <stop offset=".36" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#aebcbf"/>
      <stop offset=".84" stop-color="#6c7b80"/>
      <stop offset="1" stop-color="#3d484c"/>
    </linearGradient>
    <linearGradient id="chromeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".2" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".72" stop-color="#001a14" stop-opacity="0"/>
      <stop offset="1" stop-color="#001a14" stop-opacity=".7"/>
    </linearGradient>

    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ffe9"/>
      <stop offset=".22" stop-color="#63ecb9"/>
      <stop offset=".6" stop-color="#17b584"/>
      <stop offset="1" stop-color="#046049"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafff7" stop-opacity=".55"/>
      <stop offset=".16" stop-color="#eafff7" stop-opacity="0"/>
      <stop offset=".7" stop-color="#00382b" stop-opacity="0"/>
      <stop offset="1" stop-color="#00271e" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b7a5c"/>
      <stop offset="1" stop-color="#034534"/>
    </linearGradient>

    <radialGradient id="well" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#0a3d37"/>
      <stop offset=".7" stop-color="#031a17"/>
      <stop offset="1" stop-color="#010b09"/>
    </radialGradient>
    <linearGradient id="wellRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#013225"/>
      <stop offset="1" stop-color="#d6fff0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ffff"/>
      <stop offset=".4" stop-color="#5df4ff"/>
      <stop offset="1" stop-color="#00a9d6"/>
    </linearGradient>

    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10876a"/>
      <stop offset=".3" stop-color="#3fd9a8"/>
      <stop offset=".62" stop-color="#0c7a5e"/>
      <stop offset="1" stop-color="#033a2c"/>
    </linearGradient>

    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="26" stdDeviation="26" flood-color="#000705" flood-opacity=".75"/>
    </filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="wellShade" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feOffset in="b" dy="14" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="inner"/>
      <feFlood flood-color="#000" flood-opacity=".85"/>
      <feComposite in2="inner" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#tileFill)"/>
    <rect width="1024" height="1024" fill="url(#tileGlow)"/>

    <g transform="rotate(18 512 512) translate(520 545) scale(1.1) translate(-512 -512)">
      <g filter="url(#drop)">
        <!-- cable and strain relief -->
        <rect x="478" y="800" width="68" height="520" fill="url(#cable)"/>
        <rect x="452" y="748" width="120" height="96" rx="26" fill="url(#cable)"/>
        <g fill="#01261d" opacity=".5">
          <rect x="452" y="782" width="120" height="8"/>
          <rect x="452" y="808" width="120" height="8"/>
        </g>

        <!-- prongs -->
        <rect x="384" y="150" width="76" height="230" rx="26" fill="url(#chrome)"/>
        <rect x="384" y="150" width="76" height="230" rx="26" fill="url(#chromeShade)"/>
        <rect x="564" y="150" width="76" height="230" rx="26" fill="url(#chrome)"/>
        <rect x="564" y="150" width="76" height="230" rx="26" fill="url(#chromeShade)"/>

        <!-- body -->
        <path d="M300 372a32 32 0 0 1 32-32h360a32 32 0 0 1 32 32v168c0 128-92 230-212 230S300 668 300 540Z" fill="url(#bodyFill)"/>
      </g>

      <g clip-path="url(#body)">
        <rect x="300" y="340" width="424" height="440" fill="url(#bodySide)"/>
        <!-- collar the prongs sit in -->
        <rect x="300" y="340" width="424" height="58" fill="url(#collar)" opacity=".5"/>
        <rect x="300" y="396" width="424" height="5" fill="#eafff7" opacity=".7"/>
        <rect x="300" y="340" width="424" height="6" fill="#eafff7" opacity=".8"/>
        <!-- bevel: light on the upper left edge, shade on the lower right -->
        <path d="M300 372a32 32 0 0 1 32-32h360a32 32 0 0 1 32 32v168c0 128-92 230-212 230S300 668 300 540Z" transform="translate(-12 -16)" fill="none" stroke="#00241b" stroke-width="26" opacity=".7" filter="url(#edge)"/>
        <path d="M300 372a32 32 0 0 1 32-32h360a32 32 0 0 1 32 32v168c0 128-92 230-212 230S300 668 300 540Z" transform="translate(9 0)" fill="none" stroke="#f2fff9" stroke-width="12" opacity=".75" filter="url(#edge)"/>
        <ellipse cx="368" cy="520" rx="26" ry="96" fill="#fff" opacity=".42" filter="url(#bloom)"/>
        <!-- underside -->
        <ellipse cx="512" cy="800" rx="250" ry="90" fill="#00231a" opacity=".55" filter="url(#soft)"/>
      </g>

      <!-- recessed well with the live bolt -->
      <circle cx="512" cy="566" r="146" fill="url(#wellRim)"/>
      <circle cx="512" cy="566" r="135" fill="url(#well)" filter="url(#wellShade)"/>
      <circle cx="512" cy="566" r="92" fill="#19e6ff" opacity=".5" filter="url(#soft)"/>
      <path transform="translate(512 566) scale(1.08) translate(-512 -566)" d="M548 456 440 590h62l-26 88 110-138h-64Z" fill="#35ecff" filter="url(#bloom)"/>
      <path transform="translate(512 566) scale(1.08) translate(-512 -566)" d="M548 456 440 590h62l-26 88 110-138h-64Z" fill="url(#bolt)" stroke="#eaffff" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- rim light on the tile -->
    <rect x="5" y="5" width="1014" height="1014" rx="185" fill="none" stroke="url(#tileRim)" stroke-width="10"/>
  </g>
</svg>
